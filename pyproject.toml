[project]
name = "feed-generator"
version = "0.1.0"
description = "SignalFlow — personal information fiduciary & outside-discovery engine (PRD: docs/prd.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "feedparser>=6.0.11",
    "feedgen>=1.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.0",
    "basedpyright>=1.39.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signalflow*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not e2e"]

[tool.coverage.run]
omit = ["*/__main__.py"]

[tool.basedpyright]
# bare `basedpyright` is config-driven (no subcommand). Scope analysis to
# the package + tests: spikes/ are one-off scratch (runnable via `make
# spike`, not type-gated), and setting `exclude` alone drops the implicit
# .venv exclusion, exploding the scan.
include = ["signalflow", "tests"]
