name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: the-pr-agent/pr-agent@v0.41.1
        id: pr-agent
        env:
          OPENAI_KEY: ${{ secrets.CLOUDFLARE_AIGATEWAY_TOKEN }}
          OPENAI_BASE_URL: https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config from a maintainer-controlled branch: a PR branch cannot ship
          # its own .pr_agent.toml (api_base + the key) to the reviewer.
          PR_AGENT_CONFIG_BRANCH: pr-agent-config
      # Fail loud: fail the PR when no "PR Reviewer Guide" comment covers the
      # head commit. A guide counts when it names the commit (a review update)
      # or was posted after this run started — the first review on a PR carries
      # no SHA marker, so the SHA alone would fail every new PR.
      - name: Fail loud if no review covers the head commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RUN_STARTED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.created_at')
          COVERED=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"PR Reviewer Guide\")) and ((.body | contains(\"$SHORT_SHA\")) or (.created_at >= \"$RUN_STARTED\")))] | length")
          if [ "${COVERED:-0}" -eq 0 ]; then
            echo "::error::AI review did not post for commit $SHA — the review may have failed silently."
            exit 1
          fi
